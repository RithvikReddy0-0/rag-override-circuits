[project]
name = "rag-override-circuits"
version = "1.0.0"
description = "Mechanistic-interpretability study of context-override circuits in small LMs (CPU-only)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Rithvik Reddy" }]

# Pinned to the exact known-good versions the results were produced with.
# The transformer-lens / transformers pair is load-bearing: transformer-lens
# 1.x breaks against transformers 5.x (module 'transformers' has no attribute
# 'TRANSFORMERS_CACHE'). The combination below is verified working on CPU with
# Python 3.11. See requirements-lock.txt for the full frozen environment.
dependencies = [
    "torch==2.12.1",              # CPU build: install from the PyTorch CPU index (see README)
    "transformer-lens==3.5.0",    # known-good with transformers==5.12.1
    "transformers==5.12.1",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "matplotlib==3.11.0",
]

[project.urls]
Homepage = "https://github.com/RithvikReddy0-0/rag-override-circuits"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["pairs", "measure", "priors", "patch", "ablate", "attribution"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
